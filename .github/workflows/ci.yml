name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.16.3
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .

  steamutility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build SteamUtility bundles
        run: python scripts/build_steamutility.py
      - name: Verify bundles produced
        run: |
          test -f libs/win-x64/SteamUtility.exe
          test -f libs/linux-x64/SteamUtility
